# Example resources for testing the AgentWorkflow + AgentWorkflowRun flow.
# Migrates the coolstore Java EE app to Quarkus using 3 stages.
#
# Prerequisites:
#   - Gateway "gcp-vertex-ai" from resources.yaml
#   - Hub running with app + identity configured
#
# Usage:
#   kubectl apply -f hack/harness-test/resources.yaml
#   kubectl apply -f hack/harness-test/workflow-resources.yaml

---
apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: plan
spec:
  image: quay.io/konveyor/skills:plan
  displayName: Plan Stage
  version: "1.0.0"
  description: Analyzes a project and produces docs/plan.md with migration steps.
  type: skill
  tags:
    - migration
    - planning

---
apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: execute
spec:
  image: quay.io/konveyor/skills:execute
  displayName: Execute Stage
  version: "1.0.0"
  description: Reads docs/plan.md and executes each migration step sequentially.
  type: skill
  tags:
    - migration
    - execution

---
apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: verify
spec:
  image: quay.io/konveyor/skills:verify
  displayName: Verify Stage
  version: "1.0.0"
  description: Builds the project and fixes errors until it compiles, runs tests and runtime verification, and confirms the analysis violations were addressed.
  type: skill
  tags:
    - migration
    - verification

---
apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: migration-plan-agent
spec:
  image: quay.io/konveyor/agent-java:dev
  gateways:
    - ref: gcp-vertex-ai
  skillCards:
    - ref: plan
  params:
    - name: max_turns
      type: number
      default: "200"

---
apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: migration-execute-agent
spec:
  image: quay.io/konveyor/agent-java:dev
  gateways:
    - ref: gcp-vertex-ai
  skillCards:
    - ref: execute
  params:
    - name: max_turns
      type: number
      default: "200"

---
apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: migration-verify-agent
spec:
  image: quay.io/konveyor/agent-java:dev
  gateways:
    - ref: gcp-vertex-ai
  skillCards:
    - ref: verify
  params:
    - name: max_turns
      type: number
      default: "200"

---
apiVersion: konveyor.io/v1alpha1
kind: AgentWorkflow
metadata:
  name: java-ee-to-quarkus
spec:
  guide: "Migrate a Java EE application to Quarkus 3"
  stages:
    - name: plan
      agentRef: migration-plan-agent
      instructions: "Load the plan skill and follow its SKILL.md exactly. Build the migration plan from the Kantra analysis results in .konveyor/analysis.json, reading the build manifest, layout, and source for context. Use the output structure defined in SKILL.md as the exact structure for docs/plan.md — reproduce every required section and field. Do not invent your own document structure."
    - name: execute
      agentRef: migration-execute-agent
      instructions: "Load the execute skill and follow its SKILL.md exactly. Execute each step in docs/plan.md to migrate the code from Java EE to Quarkus. Create .konveyor/handoff.md and write your results as an ## Execute section in it, as defined in SKILL.md."
    - name: verify
      agentRef: migration-verify-agent
      instructions: "Load the verify skill and follow its SKILL.md exactly. Run the build from docs/plan.md, fix build errors until it compiles, then run tests and runtime verification — grounded in .konveyor/analysis.json and the ## Execute section of .konveyor/handoff.md. Append your results as a ## Verify section in .konveyor/handoff.md as defined in SKILL.md."

---
apiVersion: konveyor.io/v1alpha1
kind: AgentWorkflowRun
metadata:
  name: coolstore-migration-__TIMESTAMP__
spec:
  workflowRef: java-ee-to-quarkus
  gateway: gcp-vertex-ai
  env:
    - name: HUB_BASE_URL
      value: "http://host.containers.internal:8080"
    - name: HUB_TOKEN
      value: "__HUB_TOKEN__"
    - name: HUB_TOKEN_ID
      value: "__HUB_TOKEN_ID__"
    - name: APP_ID
      value: "1"
    - name: TARGET_BRANCH
      value: "konveyor/migration-__TIMESTAMP__"
    - name: GCP_PROJECT_ID
      value: "__GCP_PROJECT_ID__"
    - name: GCP_LOCATION
      value: "global"
