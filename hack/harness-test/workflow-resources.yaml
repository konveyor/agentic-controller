# Example resources for testing the AgentWorkflow + AgentWorkflowRun flow.
# Migrates the coolstore Java EE app to Quarkus using 4 stages.
#
# Prerequisites:
#   - Gateway "gcp-vertex-ai" from resources.yaml
#   - Hub running with app + identity configured
#
# Usage:
#   kubectl apply -f hack/harness-test/resources.yaml
#   kubectl apply -f hack/harness-test/workflow-resources.yaml

---
apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: questionnaire
spec:
  image: quay.io/konveyor/skills:questionnaire
  displayName: Questionnaire Stage
  version: "1.0.0"
  description: >
    Detects the source application's tech stack and gathers migration decisions.
    Produces .konveyor/questionnaire.json consumed by the plan stage.
  type: skill
  tags:
    - migration
    - questionnaire
    - detect

---
apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: plan
spec:
  image: quay.io/konveyor/skills:plan
  displayName: Plan Stage
  version: "1.0.0"
  description: Analyzes a project and produces .konveyor/spec.md and .konveyor/implementation.md with migration steps.
  type: skill
  tags:
    - migration
    - planning

---
apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: execute
spec:
  image: quay.io/konveyor/skills:execute
  displayName: Execute Stage
  version: "1.0.0"
  description: Reads .konveyor/implementation.md and executes each migration step sequentially.
  type: skill
  tags:
    - migration
    - execution

---
apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: verify
spec:
  image: quay.io/konveyor/skills:verify
  displayName: Verify Stage
  version: "1.0.0"
  description: Runs the build command, fixes errors, and iterates until the build passes.
  type: skill
  tags:
    - migration
    - verification

---
apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: javaee-to-quarkus
spec:
  image: quay.io/konveyor/skills:javaee-to-quarkus
  displayName: Java EE to Quarkus Migration
  version: "1.0.0"
  description: >
    Migrates Java EE 7/8 applications (WebLogic, JBoss, WildFly) to Quarkus 3.
    Covers EJB-to-CDI, JMS/MDB-to-SmallRye, WAR-to-JAR, persistence.xml replacement,
    JNDI removal, and server lifecycle replacement.
  type: skill
  tags:
    - java
    - javaee
    - quarkus
    - migration

---
apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: migration-questionnaire-agent
spec:
  image: quay.io/konveyor/agent-java:dev
  providers:
    - ref: gcp-vertex-ai
  skillCards:
    - ref: questionnaire
  params:
    - name: max_turns
      type: number
      default: "50"

---
apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: migration-plan-agent
spec:
  image: quay.io/konveyor/agent-java:dev
  gateways:
    - ref: gcp-vertex-ai
  skillCards:
    - ref: plan
    - ref: javaee-to-quarkus
  params:
    - name: max_turns
      type: number
      default: "200"

---
apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: migration-execute-agent
spec:
  image: quay.io/konveyor/agent-java:dev
  gateways:
    - ref: gcp-vertex-ai
  skillCards:
    - ref: execute
    - ref: javaee-to-quarkus
  params:
    - name: max_turns
      type: number
      default: "200"

---
apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: migration-verify-agent
spec:
  image: quay.io/konveyor/agent-java:dev
  gateways:
    - ref: gcp-vertex-ai
  skillCards:
    - ref: verify
    - ref: javaee-to-quarkus
  params:
    - name: max_turns
      type: number
      default: "200"

---
apiVersion: konveyor.io/v1alpha1
kind: AgentWorkflow
metadata:
  name: java-ee-to-quarkus
spec:
  guide: "Migrate a Java EE application to Quarkus 3"
  stages:
    - name: questionnaire
      agentRef: migration-questionnaire-agent
      instructions: "Load the questionnaire skill and follow its SKILL.md exactly. Analyze the source application to detect its tech stack, validate the migration prompt, and gather migration decisions. Use the output schema defined in SKILL.md as the exact structure for .konveyor/questionnaire.json — reproduce every required field. Do not invent your own output format."
    - name: plan
      agentRef: migration-plan-agent
      instructions: "Load the plan skill and follow its SKILL.md exactly. Read .konveyor/questionnaire.json and run graphify for grounding. Use the output schemas defined in SKILL.md as the exact structure for .konveyor/spec.md and .konveyor/implementation.md — reproduce every required section and field. Do not invent your own document structure."
    - name: execute
      agentRef: migration-execute-agent
      instructions: "Load the execute skill and follow its SKILL.md exactly. Execute each step in .konveyor/implementation.md to migrate the code from Java EE to Quarkus. Use the output schema defined in SKILL.md as the exact structure for .konveyor/execute.json — reproduce every required field verbatim. Do not invent your own output format."
    - name: verify
      agentRef: migration-verify-agent
      instructions: "Load the verify skill and follow its SKILL.md exactly. Run the build, fix any compilation errors, then run tests. Use the output schema defined in SKILL.md as the exact structure for .konveyor/verify.json — reproduce every required field verbatim. Do not invent your own output format."

---
apiVersion: konveyor.io/v1alpha1
kind: AgentWorkflowRun
metadata:
  name: coolstore-migration-__TIMESTAMP__
spec:
  workflowRef: java-ee-to-quarkus
  gateway: gcp-vertex-ai
  env:
    - name: HUB_BASE_URL
      value: "http://host.containers.internal:8080"
    - name: HUB_TOKEN
      value: "__HUB_TOKEN__"
    - name: HUB_TOKEN_ID
      value: "__HUB_TOKEN_ID__"
    - name: APP_ID
      value: "1"
    - name: TARGET_BRANCH
      value: "konveyor/migration-__TIMESTAMP__"
    - name: GCP_PROJECT_ID
      value: "__GCP_PROJECT_ID__"
    - name: GCP_LOCATION
      value: "global"
