apiVersion: v1
kind: ConfigMap
metadata:
  name: skill-inline-broken
data:
  # No frontmatter: invisible to the agent runtime, so it must not reach one.
  SKILL.md: |
    # No javax
    Do not use javax packages.
---
apiVersion: v1
kind: Pod
metadata:
  name: skill-loader-badskill
spec:
  restartPolicy: Never
  initContainers:
    - name: skill-loader
      image: localhost/harness-test:dev
      imagePullPolicy: IfNotPresent
      args: ["skills", "load"]
      env:
        - name: KONVEYOR_SKILL_SOURCES
          value: '[{"name":"konveyor","subPath":"plan"},{"name":"broken"}]'
      volumeMounts:
        - {name: skills, mountPath: /opt/skills}
        - {name: skill-konveyor, mountPath: /opt/skills-src/konveyor, readOnly: true}
        - {name: skill-broken, mountPath: /opt/skills-src/broken, readOnly: true}
  containers:
    - name: agent
      image: localhost/harness-test:dev
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args: ["echo 'THE AGENT SHOULD NEVER START'; ls /opt/skills"]
      volumeMounts:
        - {name: skills, mountPath: /opt/skills, readOnly: true}
  volumes:
    - name: skills
      emptyDir: {}
    - name: skill-konveyor
      image: {reference: 'localhost/konveyor-skills:dev', pullPolicy: IfNotPresent}
    - name: skill-broken
      configMap: {name: skill-inline-broken}
