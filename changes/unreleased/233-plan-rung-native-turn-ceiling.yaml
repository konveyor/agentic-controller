kind: bugfix

description: >
  The plan ladder's turn counter now reports the runtime's native ceiling
  instead of the configured maxTurns, so a default run reads "turn 170 of 170"
  at the end rather than "turn 170 of 200" — a viewer is no longer promised
  turns the prompt reserves for its wind-down handoff. Once the handoff is
  spending that reserve the configured budget becomes the denominator again,
  and the denominator never reads lower than the count itself: the native limit
  is enforced per prompt and the handoff is a second prompt, so a run could
  previously display an impossible "turn 213 of 200".
