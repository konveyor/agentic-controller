kind: feature
description: >
  Add fileMounts to the AgentRun and AgentWorkflowRun specs to attach
  Secrets or ConfigMaps into the Sandbox container as read-only files on
  disk — the file-shaped sibling of envFrom, for config or credentials a
  skill or tool reads from a path rather than the environment. Each mount
  names exactly one Secret or ConfigMap, supports whole-object directory
  mounts, key selection (items), and single-file mounts (subPath); a
  mountPath that collides with a reserved mount (including the Kubernetes
  service-account token) or overlaps another cleaned mount path fails the
  run terminally with InvalidFileMounts. Invalid items paths, missing selected
  keys, and missing subPaths also fail before Sandbox creation. Missing
  sources and API lookup errors retry, allowing apply-order races to recover.
