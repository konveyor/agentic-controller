kind: feature
description: >
  Fail fast with a clear, human-readable error when an AgentRun's source
  repository is not git (only git is supported for dev-preview; Hub reports
  subversion as Kind=="subversion"). The harness now validates the source
  SCM before cloning and writes a machine-readable reason to the pod
  termination log, which the controller copies verbatim onto
  AgentRunStatus.terminationData so the failure surfaces on status, not
  solely in logs.
