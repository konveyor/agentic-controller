kind: feature
description: >
  Add the kai CLI as a kubectl plugin (kubectl-kai). It manages the agentic
  CRDs (Gateways, Agents, Workflows and Skills) against the cluster in
  KUBECONFIG: each group supports create/edit/delete/list plus get/describe,
  and agents and workflows add run. Gateway create is a provider-validated
  wizard that can create the credential Secret inline with masked input,
  derives the model context window from a per-model default table, and covers
  anthropic, openai, google, xai, gcp-vertex-ai and aws-bedrock. Agent and
  workflow runs can target an inventory application with --app, which sets
  APP_ID and the Hub endpoint on the run; credential Secrets are imported only
  when requested with --git-secret/--env-from. 'hub login' authenticates to
  Tackle Hub (OIDC device flow) and saves a token that app-scoped runs inject as
  HUB_TOKEN through a dedicated, run-owned Kubernetes Secret. The command tree
  lives in the reusable pkg/kai package so other tools can embed it.
