kind: enhancement

description: >
  The plan ladder's task excerpt now skips a leading Markdown heading or a
  labelled preamble ("Context:", "Background:", ...) and quotes the first
  paragraph that describes the work. Stage instructions that open with a title
  or a premise used to put that on screen instead of the task. When every
  paragraph is skippable the first one is still shown. Instructions written as
  a bulleted list read as a list: every item loses its marker rather than only
  the first, and the items are separated with "; " so they do not run together
  into a sentence nobody wrote.
