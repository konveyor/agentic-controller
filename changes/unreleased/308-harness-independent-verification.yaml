kind: feature

description: >
  A stage's "- Status:" line in .konveyor/handoff.md is the agent's own account
  of its work, and nothing re-ran the commands it claimed to have run: a stage
  whose last green command was a test run reported "passed" on a tree that did
  not compile. After the agent's turn and before the final push, the harness
  now runs the commands in the "## Verification" section of docs/plan.md itself
  and records each one's exit code under "verification" in the termination data,
  independent of anything the agent wrote. Commands run through /bin/sh -c in
  the clone directory with the harness process environment — the same workspace
  and toolchain the agent used, less the Hub credentials already cleared from
  it. Blackbox and other prose lines, unfilled plan-template placeholders and
  explicit "none" values are recorded as skipped with a reason rather than
  guessed at. A missing plan, a missing or command-less Verification section, a
  disabled pass and a stage that did not reach success all record
  status "notRun" with a reason, so silence is never read as a pass. Each
  command is bounded by a timeout (HARNESS_VERIFY_TIMEOUT_SECONDS, default 600s)
  and killed as a process group, and captured output is tailed. By default a
  non-zero exit is recorded without changing the stage's phase; set
  HARNESS_VERIFY_ENFORCE=on to fail the stage on one, or HARNESS_VERIFY=off to
  skip the pass entirely.
