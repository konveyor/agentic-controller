kind: enhancement
description: >
  Build the Go binaries (manager, skill-loader, migration-harness) to be
  FIPS-compliant by compiling on Red Hat go-toolset with CGO_ENABLED=1,
  GOEXPERIMENT=strictfipsruntime, and -tags strictfipsruntime, so crypto is
  routed through the system OpenSSL. The manager/skill-loader runtime image
  moves from distroless/static to ubi9-minimal (with openssl-libs) because the
  resulting binaries are dynamically linked against libcrypto at runtime.
