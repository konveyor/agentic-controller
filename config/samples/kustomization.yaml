# Default skill resources installed with the controller, one resource per file
# as kubebuilder scaffolds them.
#
# plan and javaee-to-quarkus come out of one image, each selected with
# subPath; house-rules is inline and needs no image at all.
resources:
  - skillcard_plan.yaml
  - skillcard_javaee_to_quarkus.yaml
  - skillcard_inline_house_rules.yaml
  - skillcollection_java_migration.yaml
#+kubebuilder:scaffold:manifestskustomizesamples
