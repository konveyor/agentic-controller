# Gateway for AWS Bedrock.
#
# Prerequisites — create a Secret with your real AWS credentials:
#   kubectl create secret generic bedrock-credentials \
#     --from-literal=AWS_ACCESS_KEY_ID="<your-access-key-id>" \
#     --from-literal=AWS_SECRET_ACCESS_KEY="<your-secret-access-key>" \
#     --from-literal=AWS_REGION="<your-region>"
#
# The credential Secret uses envFrom (no key field) because Bedrock
# requires multiple AWS env vars.
#
# AWS_REGION is the only thing that decides where requests go: the harness
# lets the AWS SDK derive the endpoint from it, and the controller's
# verification probe addresses bedrock-runtime from it too. The endpoint
# below is required by the CRD and is not resolved by either, so change
# AWS_REGION rather than this line when you move regions.
apiVersion: konveyor.io/v1alpha1
kind: Gateway
metadata:
  name: aws-bedrock
spec:
  provider: aws-bedrock
  endpoint: "https://bedrock-runtime.us-east-1.amazonaws.com"
  credentialRef:
    secretName: bedrock-credentials
  model:
    name: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    contextWindow: 200000
    tier: premium
