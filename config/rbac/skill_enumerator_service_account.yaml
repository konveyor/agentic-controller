# The identity the skill enumeration Job runs as.
#
# That Job mounts a user-supplied OCI image and writes the SkillCards it finds
# in it, so it needs credentials the agent pods it feeds do not. See the trust
# boundary in internal/controller/skillcollection_enumerate.go: the Role bound
# to this account reaches SkillCards in one namespace and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: agentic-controller
    app.kubernetes.io/managed-by: kustomize
  name: skill-enumerator
  namespace: system
