# What the skill enumeration Job may do.
#
# A Role rather than a ClusterRole, and SkillCards rather than the API group:
# the Job runs a pod that mounted a user-supplied image, so the blast radius of
# a compromise is the cards in one namespace. It gets no secrets, no pods and
# no collections. list and delete are needed as well as create and update,
# because the Job prunes the cards a source no longer contains.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: agentic-controller
    app.kubernetes.io/managed-by: kustomize
  name: skill-enumerator-role
  namespace: system
rules:
- apiGroups:
  - konveyor.io
  resources:
  - skillcards
  verbs:
  - create
  - delete
  - get
  - list
  - update
