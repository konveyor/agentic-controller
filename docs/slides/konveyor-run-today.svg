<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="440" viewBox="0 0 1160 440" role="img" aria-labelledby="title desc">
  <title id="title">How a Konveyor run works today</title>
  <desc id="desc">A user chooses an application and task. The Konveyor controller creates an Agent Sandbox workload. Inside it, the harness prepares the repository and launches Goose. Goose works on the code and commits locally. The harness verifies the work and pushes the result to Git.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b7bfd4"/></marker>
    <style>
      text { font-family: 'Red Hat Display', Helvetica, Arial, sans-serif; fill: #ffffff; }
      .label { font-size: 27px; font-weight: 600; }
      .small { font-size: 23px; fill: #d5d9e3; }
      .outline { fill: none; stroke: #8893ae; stroke-width: 2; }
      .center { text-anchor: middle; }
    </style>
  </defs>
  <g id="run-steps">
    <text x="20" y="63" class="label">1. You choose an app and a task</text>
    <text x="20" y="151" class="label">2. Our harness prepares the repo</text>
    <text x="20" y="239" class="label">3. Goose works on the code</text>
    <text x="52" y="274" class="small">Calls the model, uses tools, commits locally</text>
    <text x="20" y="351" class="label">4. Our harness verifies and pushes</text>
    <text x="52" y="386" class="small">You get the result on a Git branch</text>
  </g>
  <g id="workload" class="center">
    <rect x="655" y="18" width="450" height="58" rx="5" class="outline"/>
    <text x="880" y="55" class="label">Konveyor controller</text>
    <line x1="880" y1="78" x2="880" y2="130" stroke="#b7bfd4" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="950" y="110" class="small">creates</text>
    <rect x="615" y="142" width="530" height="280" rx="7" class="outline"/>
    <text x="880" y="182" class="label">Agent Sandbox workload</text>
    <rect x="645" y="204" width="470" height="190" rx="5" class="outline"/>
    <text x="880" y="249" class="label">Konveyor harness</text>
    <text x="880" y="285" class="small">launches the runtime</text>
    <rect x="675" y="310" width="410" height="60" rx="4" fill="#343983" stroke="#8893ae"/>
    <text x="880" y="349" class="label">Goose</text>
  </g>
</svg>
