name: PR Checks

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  merge_group:

jobs:
  verify:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    name: Verify PR contents
    outputs:
      pr_type: ${{ steps.verifier.outputs.pr_type }}
    steps:
      - name: Check Title
        id: verifier
        uses: konveyor/release-tools/cmd/verify-pr@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  changelog:
    runs-on: ubuntu-latest
    needs: verify
    if: contains(fromJSON('["feature", "bugfix", "breaking"]'), needs.verify.outputs.pr_type)
    name: Verify changelog fragment
    steps:
      # actions/checkout refuses to check out fork PR code in a
      # pull_request_target workflow, so check out the base repo and fetch
      # the PR head as a ref that is only diffed, never checked out or run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR head ref
        run: git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head
      - name: Check for changelog fragment
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          FRAGMENTS=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...pr-head" -- 'changes/unreleased/*.yaml' 'changes/unreleased/*.yml')
          if [ -z "$FRAGMENTS" ]; then
            echo "::error::This is a ${{ needs.verify.outputs.pr_type }} PR — a changelog fragment is required in changes/unreleased/"
            echo ""
            echo "To create one:"
            echo "  make changelog-create NAME=<pr-number>-<short-description> KIND=<kind>"
            echo ""
            echo "Or manually create a YAML file in changes/unreleased/ with 'kind' and 'description' fields."
            echo "See changes/template.yaml for the format."
            exit 1
          fi
          echo "Found changelog fragments:"
          echo "$FRAGMENTS"

  pr-checks:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: pr-checks
    needs:
      - verify
      - changelog
    steps:
      - name: Check results
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULT_VERIFY: ${{ needs.verify.result }}
          RESULT_CHANGELOG: ${{ needs.changelog.result }}
        run: |
          # During merge_group, verify and changelog are expected to be skipped
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "PR checks skipped (merge queue)"
            exit 0
          fi

          FAILED=false
          for result_var in RESULT_VERIFY RESULT_CHANGELOG; do
            result="${!result_var}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::${result_var} = ${result}"
              FAILED=true
            fi
          done

          if [[ "$FAILED" == "true" ]]; then
            exit 1
          fi

          echo "All PR checks passed"
