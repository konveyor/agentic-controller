name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # An overlay that retags the controller without repeating the base's
      # replacement leaves the loader pointing at a placeholder, which shows up
      # as ErrImagePull on an init container rather than anything readable.
      - name: Verify the loader image matches the manager's
        run: make verify-loader-image

      - name: Verify ADR indexes
        run: make verify-adr-index

      - name: Running Tests
        run: make test

  api-test:
    permissions:
      contents: read
    name: API test
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod

      - name: Verify go.mod is tidy
        working-directory: api
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # api/skill is the one skill validator the controller, the loader and CI
      # all call, so a break here breaks every caller at once.
      - name: Running Tests
        working-directory: api
        run: go test ./...

  harness-test:
    permissions:
      contents: read
    name: Harness test
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: harness/go.mod

      - name: Verify go.mod is tidy
        working-directory: harness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Running Tests
        working-directory: harness
        run: go test ./...
