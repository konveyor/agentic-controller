name: Sync manifests to operator

# On every merge, render this repo's operator-facing manifests (CRDs, RBAC, and
# the curated default content) into a checkout of konveyor/operator, regenerate
# the OLM bundle so the ClusterServiceVersion reflects any CRD/RBAC change, and
# open (or update) a PR there. The operator ships the agentic controller as an
# operand; those artifacts are defined HERE, so a human should only ever have to
# review and merge the PR this raises -- never hand-copy anything.
#
# hack/sync-operator.sh does the rendering and is runnable locally to preview the
# result. `make bundle` is run with the operator's own defaults (VERSION/IMG),
# matching its csv-validate.yml, so the only bundle churn is CRD/RBAC-driven.
#
# The head branch is fixed per base branch. Reuse its existing history, merge in
# the target branch, then append a sync commit with a normal push. This preserves
# operator integration and review fixes added while the sync PR is open.

on:
  push:
    branches:
      - main
      - 'release-*'
    paths:
      - 'config/crd/bases/**'
      - 'config/rbac/**'
      - 'config/defaults/**'
      - 'config/operator/**'
      - 'hack/sync-operator.sh'
      - '.github/workflows/sync-operator.yml'
  workflow_dispatch: {}

concurrency:
  group: sync-operator-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    name: Render manifests and open PR against konveyor/operator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout agentic-controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # main -> operator main; release-X -> operator release-X (same name).
      - name: Resolve operator target and head branches
        id: branches
        run: |
          base="${GITHUB_REF_NAME}"
          if [ "${base}" = "main" ]; then
            head="sync/agentic-controller"
          else
            head="sync/agentic-controller-${base}"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "head=${head}" >> "$GITHUB_OUTPUT"

      - name: Get token
        id: token
        uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668 # v5.1.1
        with:
          application_id: ${{ vars.KONVEYOR_BOT_ID }}
          application_private_key: ${{ secrets.KONVEYOR_BOT_KEY }}

      # A release-* branch may be cut here before konveyor/operator cuts the
      # matching one. Rather than let every sync run on that branch fail with a
      # cryptic checkout error until someone creates it upstream, detect the
      # missing branch and skip cleanly with a warning. We do NOT fall back to
      # main: main is driven by this repo's own main-triggered sync, so pushing
      # release-* content there would clobber it.
      - name: Check operator target branch exists
        id: target
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BASE: ${{ steps.branches.outputs.base }}
        run: |
          # We must skip ONLY on a genuinely-missing branch, and fail on
          # everything else. GitHub returns 404 both for a missing branch and
          # for a repo the App cannot see, so a bare "did the call fail?" would
          # mask the installation/permission problem called out in the PR
          # description (and swallow 5xx/network errors too), leaving no sync PR
          # and a green job. We need the actual HTTP status, which `gh api` does
          # not surface cleanly, so query with curl and branch on the code.
          http_status() {
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/$1"
          }

          # First confirm the App can see the repo at all. A non-200 here is an
          # access/auth problem (or an outage), never a missing branch: fail.
          repo_status="$(http_status "repos/konveyor/operator")"
          if [ "${repo_status}" != "200" ]; then
            echo "::error::Cannot access konveyor/operator (HTTP ${repo_status}); check the bot App installation and permissions." >&2
            exit 1
          fi

          # Repo is reachable, so a 404 on the branch genuinely means it does
          # not exist yet -- skip cleanly. Anything other than 200/404 (5xx,
          # rate limit, network) is transient: fail so the run surfaces it.
          branch_status="$(http_status "repos/konveyor/operator/branches/${BASE}")"
          case "${branch_status}" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::warning::konveyor/operator has no '${BASE}' branch yet; skipping sync. Create it upstream to resume."
              ;;
            *)
              echo "::error::Unexpected HTTP ${branch_status} checking konveyor/operator branch '${BASE}'." >&2
              exit 1
              ;;
          esac

      - name: Checkout konveyor/operator
        if: steps.target.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: konveyor/operator
          ref: ${{ steps.branches.outputs.base }}
          path: operator
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      # Start from the remote sync head before rendering so manual integration
      # commits survive. Merge the current base even when an older sync PR was
      # squash-merged and its branch still exists. Conflicts require a human;
      # never rebuild an existing branch from base or force-push over its work.
      - name: Prepare operator sync branch
        if: steps.target.outputs.exists == 'true'
        working-directory: operator
        env:
          BASE: ${{ steps.branches.outputs.base }}
          HEAD: ${{ steps.branches.outputs.head }}
        run: |
          set -euo pipefail
          git config user.name "konveyor"
          git config user.email "konveyor@users.noreply.github.com"
          git fetch --no-tags origin "refs/heads/${BASE}:refs/remotes/origin/${BASE}"

          if git ls-remote --exit-code --heads origin "refs/heads/${HEAD}" > /dev/null; then
            git fetch --no-tags origin "refs/heads/${HEAD}:refs/remotes/origin/${HEAD}"
            git checkout --no-track -b "${HEAD}" "refs/remotes/origin/${HEAD}"
            if ! git merge --no-edit --signoff "refs/remotes/origin/${BASE}"; then
              echo "::error::Cannot merge operator ${BASE} into ${HEAD}. Resolve conflicts on the sync branch and rerun; no remote history was changed." >&2
              exit 1
            fi
          else
            status=$?
            # ls-remote returns 2 only when no matching ref exists. Auth,
            # network, and server errors must fail instead of starting over.
            if [ "${status}" -ne 2 ]; then
              echo "::error::Cannot check operator sync branch ${HEAD} (git exit ${status})." >&2
              exit "${status}"
            fi
            git checkout --no-track -b "${HEAD}" "refs/remotes/origin/${BASE}"
          fi

      - name: Render manifests into operator checkout
        if: steps.target.outputs.exists == 'true'
        run: ./hack/sync-operator.sh operator

      # Regenerate the CSV so owned CRDs and clusterPermissions track the synced
      # CRDs/RBAC. Uses the operator's default VERSION/IMG, exactly as its own
      # csv-validate.yml does, so createdAt is the only unrelated churn.
      - name: Regenerate OLM bundle
        if: steps.target.outputs.exists == 'true'
        working-directory: operator
        run: |
          make operator-sdk
          make bundle

      # Stage first so newly added files (e.g. the defaults directory on the very
      # first sync) count -- plain `git diff` only sees tracked changes. The -I
      # filter drops the CSV's createdAt timestamp, which moves every run, so a
      # no-op sync is correctly detected as no change.
      - name: Detect config changes
        id: diff
        if: steps.target.outputs.exists == 'true'
        working-directory: operator
        run: |
          git add -A -- helm/templates/crds helm/templates/rbac roles/tackle/templates/agentic bundle
          if git diff --cached --quiet -I'^    createdAt: ' -- helm/templates/crds helm/templates/rbac roles/tackle/templates/agentic bundle; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No substantive manifest changes; nothing to sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- helm/templates/crds helm/templates/rbac roles/tackle/templates/agentic bundle
          fi

      - name: Push sync commit
        if: steps.target.outputs.exists == 'true' && steps.diff.outputs.changed == 'true'
        working-directory: operator
        env:
          HEAD: ${{ steps.branches.outputs.head }}
          SRC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git commit -s -m ":seedling: Sync agentic-controller manifests

          Rendered from konveyor/agentic-controller@${SRC_SHA} by
          hack/sync-operator.sh + make bundle. Do not hand-edit the synced
          files; re-run the sync instead."
          # A concurrent human/bot push rejects this update instead of losing
          # the new remote commits. Rerun from the latest head to retry.
          git push origin "${HEAD}"

      - name: Open or update PR
        if: steps.target.outputs.exists == 'true' && steps.diff.outputs.changed == 'true'
        working-directory: operator
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BASE: ${{ steps.branches.outputs.base }}
          HEAD: ${{ steps.branches.outputs.head }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo konveyor/operator \
            --head "${HEAD}" --base "${BASE}" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            echo "PR #${existing} already open; appended the sync commit."
          else
            gh pr create --repo konveyor/operator \
              --base "${BASE}" --head "${HEAD}" \
              --title ":seedling: Sync agentic-controller manifests" \
              --body "Automated sync of CRDs, RBAC, default content, and the
          regenerated OLM bundle from
          [konveyor/agentic-controller](https://github.com/konveyor/agentic-controller).

          Generated by \`.github/workflows/sync-operator.yml\`; the synced files
          carry a do-not-hand-edit banner. New variables or operand templates
          require corresponding operator defaults and lifecycle tasks before
          merge. Reconcile metrics resources before applying a Deployment that
          requires the serving-certificate Secret."
          fi
