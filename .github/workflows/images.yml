name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'harness/**'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'api/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'images/**'
      - 'harness/**'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'api/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch: {}

permissions: {}

jobs:
  controller-agent:
    permissions:
      contents: read
    name: Build controller agent image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build image
        run: make controller-agent-build

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: make controller-agent-push

  # PR-time only: build agent-base + all four language images natively for
  # amd64 and arm64, and upload each as a downloadable workflow artifact
  # instead of pushing (no credentials needed). Uses Konveyor's shared
  # build-image action — the same one analyzer-lsp's demo-testing.yml uses.
  # The real multi-arch build+push happens in agent-base-multiarch/
  # agent-lang-images-multiarch below, on push/dispatch only.
  agent-base-artifact:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    name: Build agent-base artifact (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and upload agent-base artifact
        uses: konveyor/ci/build-image@e45ec039d03d41be52ae0c9abef260ee3ae8172a # main
        with:
          repo: ${{ github.repository }}
          checked_out: true
          image_name: agent-base
          image_tag: pr${{ github.event.pull_request.number }}_${{ matrix.arch }}
          dockerfile_path: images/agent-base/Containerfile
          build_context: "."
          cache-key-file: harness/go.sum

  agent-lang-images-artifact:
    needs: agent-base-artifact
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    name: Build ${{ matrix.image.name }} artifact (${{ matrix.arch_info.arch }})
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: agent-go
            containerfile: images/agent-go/Containerfile
          - name: agent-java
            containerfile: images/agent-java/Containerfile
          - name: agent-csharp
            containerfile: images/agent-csharp/Containerfile
          - name: agent-nodejs
            containerfile: images/agent-nodejs/Containerfile
        arch_info:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch_info.runner }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and upload ${{ matrix.image.name }} artifact
        uses: konveyor/ci/build-image@e45ec039d03d41be52ae0c9abef260ee3ae8172a # main
        with:
          repo: ${{ github.repository }}
          checked_out: true
          image_name: ${{ matrix.image.name }}
          image_tag: pr${{ github.event.pull_request.number }}_${{ matrix.arch_info.arch }}
          dockerfile_path: ${{ matrix.image.containerfile }}
          build_context: "."
          base_image: agent-base--pr${{ github.event.pull_request.number }}_${{ matrix.arch_info.arch }}
          base_image_arg: BASE_IMAGE

  # Combine each image's amd64+arm64 artifacts into one downloadable
  # multi-arch manifest tar (podman manifest add ... docker-archive:<file>,
  # then podman manifest push --all ... oci-archive:<file>) — no registry
  # involved, so there's no risk of the local/registry name-collision issue
  # documented in images/README.md.
  agent-images-multiarch-artifact:
    needs: [agent-base-artifact, agent-lang-images-artifact]
    if: github.event_name == 'pull_request'
    name: Combine ${{ matrix.image }} multi-arch artifact
    strategy:
      fail-fast: false
      matrix:
        image: [agent-base, agent-go, agent-java, agent-csharp, agent-nodejs]
    runs-on: ubuntu-latest
    steps:
      - name: Download per-arch ${{ matrix.image }} artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "${{ matrix.image }}--pr${{ github.event.pull_request.number }}_*"
          path: /tmp/images
          merge-multiple: true

      - name: Combine into a multi-arch manifest and save
        id: combine
        run: |
          TAG="pr${{ github.event.pull_request.number }}"
          podman manifest create "${{ matrix.image }}:${TAG}"
          for image in /tmp/images/*.tar; do
            echo "Loading image: ${image}"
            podman load -i "${image}"
            podman manifest add "${{ matrix.image }}:${TAG}" "docker-archive:${image}"
          done
          mkdir -p image_artifact
          TAR_FILE="image_artifact/${{ matrix.image }}--${TAG}-multiarch.tar"
          podman manifest push --all "${{ matrix.image }}:${TAG}" "oci-archive:${TAR_FILE}:${{ matrix.image }}:${TAG}"
          echo "tar_file=${TAR_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload combined multi-arch artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "${{ matrix.image }}--pr${{ github.event.pull_request.number }}-multiarch"
          path: ${{ steps.combine.outputs.tar_file }}
          retention-days: 7

  # Multi-arch (amd64/arm64) build+push, via Konveyor's shared reusable
  # workflow: each arch builds natively (arm64 gets a real ARM runner) and
  # pushes under an arch-suffixed tag, then a final job assembles those into
  # a manifest list under the real tag. agent-base publishes first so the
  # language images' "FROM quay.io/konveyor/agent-base" resolves against an
  # already-published, genuinely multi-arch manifest.
  agent-base-multiarch:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    name: Build and push agent-base (multi-arch)
    uses: konveyor/release-tools/.github/workflows/build-push-images.yaml@4cf4ec7e8a15336b88c3e5ba2ee126f4082f53f2 # main
    with:
      registry: "quay.io/konveyor"
      image_name: agent-base
      containerfile: images/agent-base/Containerfile
      context: "."
      architectures: '["amd64", "arm64"]'
    secrets:
      registry_username: ${{ vars.QUAY_USERNAME }}
      registry_password: ${{ secrets.QUAY_PASSWORD }}

  agent-lang-images-multiarch:
    needs: agent-base-multiarch
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    name: Build and push ${{ matrix.images.name }} (multi-arch)
    strategy:
      fail-fast: false
      matrix:
        images:
          - name: agent-go
            containerfile: images/agent-go/Containerfile
          - name: agent-java
            containerfile: images/agent-java/Containerfile
          - name: agent-csharp
            containerfile: images/agent-csharp/Containerfile
          - name: agent-nodejs
            containerfile: images/agent-nodejs/Containerfile
    uses: konveyor/release-tools/.github/workflows/build-push-images.yaml@4cf4ec7e8a15336b88c3e5ba2ee126f4082f53f2 # main
    with:
      registry: "quay.io/konveyor"
      image_name: ${{ matrix.images.name }}
      containerfile: ${{ matrix.images.containerfile }}
      context: "."
      architectures: '["amd64", "arm64"]'
    secrets:
      registry_username: ${{ vars.QUAY_USERNAME }}
      registry_password: ${{ secrets.QUAY_PASSWORD }}

  controller:
    permissions:
      contents: read
    name: Build controller image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build image
        run: make docker-build

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: make docker-push
