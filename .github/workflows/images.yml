name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'harness/**'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'api/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/actions/**'
      - '.github/workflows/images.yml'
  pull_request:
    # Always report the required images check, including docs-only PRs.
    # check-changes skips the image builds when no relevant paths changed.
  merge_group:
  workflow_dispatch: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check-changes.outputs.should-build }}
      build-revision: ${{ steps.source.outputs.build-revision }}
      pr-head-revision: ${{ steps.source.outputs.pr-head-revision }}
      image-tag-prefix: ${{ steps.source.outputs.image-tag-prefix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record image source revisions
        id: source
        env:
          PR_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "build-revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pr-head-revision=${PR_HEAD_REVISION}" >> "$GITHUB_OUTPUT"
          if [[ -n "$PR_NUMBER" ]]; then
            echo "image-tag-prefix=pr${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "image-tag-prefix=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Did only non-code files change?
        id: code-changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            images/**
            harness/**
            Dockerfile
            cmd/**
            internal/**
            api/**
            go.mod
            go.sum
            .github/actions/**
            .github/workflows/images.yml

      - name: Check what types of changes have been made
        id: check-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          ANY_CODE_CHANGED: ${{ steps.code-changes.outputs.any_modified }}
        run: |
          # should-build: Skip image builds for pull_request and merge_group events
          # with no code path changes. For push and workflow_dispatch, always build.
          SHOULD_BUILD=$(
            if [[ $EVENT_NAME == "pull_request" || $EVENT_NAME == "merge_group" ]] && [[ $ANY_CODE_CHANGED != true ]]; then
              echo "false"
            else
              echo "true"
            fi
          )

          echo "should-build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

      - name: Summarize findings
        env:
          ANY_CODE_CHANGED: ${{ steps.code-changes.outputs.any_modified }}
          MODIFIED_CODE: ${{ steps.code-changes.outputs.all_modified_files }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Change Detection Findings
            - Code paths changed? \`$ANY_CODE_CHANGED\`
            - Should build? \`${{ steps.check-changes.outputs.should-build }}\`
          EOF

          if [[ $ANY_CODE_CHANGED == true ]] && [[ -n "$MODIFIED_CODE" ]]; then
            echo "## Modified code files" >> "$GITHUB_STEP_SUMMARY"
            for file in ${MODIFIED_CODE}; do
              echo "  - \`$file\`" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

  controller-agent:
    needs: check-changes
    if: needs.check-changes.outputs.should-build == 'true'
    permissions:
      contents: read
    name: Build controller agent image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: make controller-agent-build

      - name: Log in to Quay.io
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: make controller-agent-push

  # PR-time only: build agent-base + all four language images natively for
  # amd64 and arm64, and upload each as a downloadable workflow artifact
  # instead of pushing (no credentials needed). Uses Konveyor's shared
  # build-image action — the same one analyzer-lsp's demo-testing.yml uses,
  # transitively, via e2e-image-build.yaml.
  # The real multi-arch build+push lives in image-build-push.yml
  # (filter-free so tag pushes fire reliably).
  agent-base-artifact:
    needs: check-changes
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.check-changes.outputs.should-build == 'true'
    permissions:
      contents: read
    name: Build agent-base artifact (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and upload agent-base artifact
        uses: konveyor/ci/build-image@e45ec039d03d41be52ae0c9abef260ee3ae8172a # main
        with:
          repo: ${{ github.repository }}
          checked_out: true
          image_name: agent-base
          image_tag: ${{ needs.check-changes.outputs.image-tag-prefix }}-${{ matrix.arch }}
          dockerfile_path: images/agent-base/Containerfile
          build_context: "."
          build_args: >-
            CONTROLLER_REVISION=${{ needs.check-changes.outputs.build-revision }}
            CONTROLLER_PR_HEAD_REVISION=${{ needs.check-changes.outputs.pr-head-revision }}
          cache-key-file: harness/go.sum

      - name: Verify image provenance
        env:
          IMAGE: localhost/agent-base:${{ needs.check-changes.outputs.image-tag-prefix }}-${{ matrix.arch }}
          PR_HEAD_REVISION: ${{ needs.check-changes.outputs.pr-head-revision }}
        run: |
          revision=$(git rev-parse HEAD)
          runtime_revision=$(sed -n 's/^ARG LIGHTSPEED_REVISION=//p' images/agent-base/Containerfile)
          labels=$(podman image inspect "$IMAGE" | jq '.[0] | .Labels // .Config.Labels')
          jq -e --arg revision "$revision" --arg head "$PR_HEAD_REVISION" --arg runtime "$runtime_revision" '
            .["org.opencontainers.image.revision"] == $revision and
            .["io.konveyor.controller.pr-head-revision"] == $head and
            .["io.konveyor.lightspeed.revision"] == $runtime
          ' <<< "$labels"
          # A stale/nightly base fallback cannot pass the source-label checks.
          {
            echo "### $IMAGE"
            echo "Build revision: $revision; PR head: $PR_HEAD_REVISION"
            echo "Labels: $labels"
            sha256sum image_artifact/*.tar
          } >> "$GITHUB_STEP_SUMMARY"

  agent-lang-images-artifact:
    needs:
      - check-changes
      - agent-base-artifact
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.check-changes.outputs.should-build == 'true'
    permissions:
      contents: read
    name: Build ${{ matrix.image.name }} artifact (${{ matrix.arch_info.arch }})
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: agent-go
            containerfile: images/agent-go/Containerfile
          - name: agent-java
            containerfile: images/agent-java/Containerfile
          - name: agent-csharp
            containerfile: images/agent-csharp/Containerfile
          - name: agent-nodejs
            containerfile: images/agent-nodejs/Containerfile
        arch_info:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch_info.runner }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and upload ${{ matrix.image.name }} artifact
        uses: konveyor/ci/build-image@e45ec039d03d41be52ae0c9abef260ee3ae8172a # main
        with:
          repo: ${{ github.repository }}
          checked_out: true
          image_name: ${{ matrix.image.name }}
          image_tag: ${{ needs.check-changes.outputs.image-tag-prefix }}-${{ matrix.arch_info.arch }}
          dockerfile_path: ${{ matrix.image.containerfile }}
          build_context: "."
          base_image: agent-base--${{ needs.check-changes.outputs.image-tag-prefix }}-${{ matrix.arch_info.arch }}
          base_image_arg: BASE_IMAGE

      - name: Verify image provenance
        env:
          IMAGE: localhost/${{ matrix.image.name }}:${{ needs.check-changes.outputs.image-tag-prefix }}-${{ matrix.arch_info.arch }}
          PR_HEAD_REVISION: ${{ needs.check-changes.outputs.pr-head-revision }}
        run: |
          revision=$(git rev-parse HEAD)
          runtime_revision=$(sed -n 's/^ARG LIGHTSPEED_REVISION=//p' images/agent-base/Containerfile)
          labels=$(podman image inspect "$IMAGE" | jq '.[0] | .Labels // .Config.Labels')
          jq -e --arg revision "$revision" --arg head "$PR_HEAD_REVISION" --arg runtime "$runtime_revision" '
            .["org.opencontainers.image.revision"] == $revision and
            .["io.konveyor.controller.pr-head-revision"] == $head and
            .["io.konveyor.lightspeed.revision"] == $runtime
          ' <<< "$labels"
          # A stale/nightly base fallback cannot pass the source-label checks.
          {
            echo "### $IMAGE"
            echo "Build revision: $revision; PR head: $PR_HEAD_REVISION"
            echo "Labels: $labels"
            sha256sum image_artifact/*.tar
          } >> "$GITHUB_STEP_SUMMARY"

  # PR-time controller archive. The versioned build+push of the controller
  # image lives in image-build-push.yml (filter-free so tag pushes fire).
  controller:
    needs: check-changes
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.check-changes.outputs.should-build == 'true'
    permissions:
      contents: read
    name: Build controller image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and archive controller image
        env:
          IMAGE_TAG: ${{ needs.check-changes.outputs.image-tag-prefix }}-amd64
          PR_HEAD_REVISION: ${{ needs.check-changes.outputs.pr-head-revision }}
        run: |
          image="localhost/agentic-controller:${IMAGE_TAG}"
          revision=$(git rev-parse HEAD)
          docker build -t "$image" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "io.konveyor.controller.pr-head-revision=$PR_HEAD_REVISION" .
          mkdir -p image_artifact
          docker save "$image" -o "image_artifact/agentic-controller--${IMAGE_TAG}.tar"
          {
            echo "### $image"
            echo "Build revision: $revision; PR head: $PR_HEAD_REVISION"
            sha256sum image_artifact/*.tar
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload controller image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentic-controller--${{ needs.check-changes.outputs.image-tag-prefix }}-amd64
          path: image_artifact/*.tar
          retention-days: 7

  images:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: images
    needs:
      - check-changes
      - controller-agent
      - agent-base-artifact
      - agent-lang-images-artifact
      - controller
    steps:
      - name: Check results
        env:
          SHOULD_BUILD: ${{ needs.check-changes.outputs.should-build }}
          RESULT_CHECK: ${{ needs.check-changes.result }}
          RESULT_CONTROLLER_AGENT: ${{ needs.controller-agent.result }}
          RESULT_AGENT_BASE: ${{ needs.agent-base-artifact.result }}
          RESULT_AGENT_LANGS: ${{ needs.agent-lang-images-artifact.result }}
          RESULT_CONTROLLER: ${{ needs.controller.result }}
        run: |
          # check-changes must always succeed
          if [[ "$RESULT_CHECK" != "success" ]]; then
            echo "::error::check-changes result: $RESULT_CHECK"
            exit 1
          fi

          # When should-build is false, remaining jobs are expected to be skipped
          if [[ "$SHOULD_BUILD" == "false" ]]; then
            echo "Build skipped (no code changes)"
            exit 0
          fi

          # When should-build is true, downstream jobs must succeed (or be skipped for PR-only jobs on push)
          FAILED=false
          for result_var in RESULT_CONTROLLER_AGENT RESULT_AGENT_BASE RESULT_AGENT_LANGS RESULT_CONTROLLER; do
            result="${!result_var}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::${result_var} = ${result}"
              FAILED=true
            fi
          done

          if [[ "$FAILED" == "true" ]]; then
            exit 1
          fi

          echo "All image checks passed"
