name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'harness/**'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'api/**'
      - 'go.mod'
      - 'go.sum'
      # agent-base-artifact now builds through .github/actions/goose-image, so an
      # edit to that action changes what this workflow produces. Without these
      # the arm64 leg -- which has no other consumer anywhere in CI -- would
      # not run at all on a PR that only touches the action.
      - '.github/actions/**'
      - '.github/workflows/images.yml'
  pull_request:
    # Always report the required images check, including docs-only PRs.
    # check-changes skips the image builds when no relevant paths changed.
  merge_group:
  workflow_dispatch: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check-changes.outputs.should-build }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Did only non-code files change?
        id: code-changes
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v46
        with:
          files: |
            images/**
            harness/**
            Dockerfile
            cmd/**
            internal/**
            api/**
            go.mod
            go.sum
            .github/actions/**
            .github/workflows/images.yml

      - name: Check what types of changes have been made
        id: check-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          ANY_CODE_CHANGED: ${{ steps.code-changes.outputs.any_modified }}
        run: |
          # should-build: Skip image builds for pull_request and merge_group events
          # with no code path changes. For push and workflow_dispatch, always build.
          SHOULD_BUILD=$(
            if [[ $EVENT_NAME == "pull_request" || $EVENT_NAME == "merge_group" ]] && [[ $ANY_CODE_CHANGED != true ]]; then
              echo "false"
            else
              echo "true"
            fi
          )

          echo "should-build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

      - name: Summarize findings
        env:
          ANY_CODE_CHANGED: ${{ steps.code-changes.outputs.any_modified }}
          MODIFIED_CODE: ${{ steps.code-changes.outputs.all_modified_files }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Change Detection Findings
            - Code paths changed? \`$ANY_CODE_CHANGED\`
            - Should build? \`${{ steps.check-changes.outputs.should-build }}\`
          EOF

          if [[ $ANY_CODE_CHANGED == true ]] && [[ -n "$MODIFIED_CODE" ]]; then
            echo "## Modified code files" >> "$GITHUB_STEP_SUMMARY"
            for file in ${MODIFIED_CODE}; do
              echo "  - \`$file\`" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

  controller-agent:
    needs: check-changes
    if: needs.check-changes.outputs.should-build == 'true'
    permissions:
      contents: read
    name: Build controller agent image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: make controller-agent-build

      - name: Log in to Quay.io
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: make controller-agent-push

  # PR-time only: build agent-base + all four language images natively for
  # amd64 and arm64, and upload each as a downloadable workflow artifact
  # instead of pushing (no credentials needed). Uses Konveyor's shared
  # build-image action — the same one analyzer-lsp's demo-testing.yml uses,
  # transitively, via e2e-image-build.yaml.
  # The real multi-arch build+push lives in image-build-push.yml
  # (filter-free so tag pushes fire reliably).
  agent-base-artifact:
    needs: check-changes
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.check-changes.outputs.should-build == 'true'
    permissions:
      contents: read
    name: Build agent-base artifact (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same ~35 minute goose compile the e2e job pays for, on two runners
      # here. image-build-push.yml deliberately does not use this: the
      # published images build goose from source.
      - name: Restore the prebuilt goose image
        id: goose
        uses: ./.github/actions/goose-image

      - name: Build and upload agent-base artifact
        uses: konveyor/ci/build-image@e45ec039d03d41be52ae0c9abef260ee3ae8172a # main
        with:
          repo: ${{ github.repository }}
          checked_out: true
          image_name: agent-base
          image_tag: pr${{ github.event.pull_request.number }}-${{ matrix.arch }}
          dockerfile_path: images/agent-base/Containerfile
          build_context: "."
          build_args: GOOSE_IMAGE=${{ steps.goose.outputs.image }}
          cache-key-file: harness/go.sum

  agent-lang-images-artifact:
    needs:
      - check-changes
      - agent-base-artifact
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.check-changes.outputs.should-build == 'true'
    permissions:
      contents: read
    name: Build ${{ matrix.image.name }} artifact (${{ matrix.arch_info.arch }})
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: agent-go
            containerfile: images/agent-go/Containerfile
          - name: agent-java
            containerfile: images/agent-java/Containerfile
          - name: agent-csharp
            containerfile: images/agent-csharp/Containerfile
          - name: agent-nodejs
            containerfile: images/agent-nodejs/Containerfile
        arch_info:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch_info.runner }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and upload ${{ matrix.image.name }} artifact
        uses: konveyor/ci/build-image@e45ec039d03d41be52ae0c9abef260ee3ae8172a # main
        with:
          repo: ${{ github.repository }}
          checked_out: true
          image_name: ${{ matrix.image.name }}
          image_tag: pr${{ github.event.pull_request.number }}-${{ matrix.arch_info.arch }}
          dockerfile_path: ${{ matrix.image.containerfile }}
          build_context: "."
          base_image: agent-base--pr${{ github.event.pull_request.number }}-${{ matrix.arch_info.arch }}
          base_image_arg: BASE_IMAGE

  # PR-time build check only. The versioned build+push of the controller
  # image lives in image-build-push.yml (filter-free so tag pushes fire).
  controller:
    needs: check-changes
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.check-changes.outputs.should-build == 'true'
    permissions:
      contents: read
    name: Build controller image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: make docker-build

  images:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: images
    needs:
      - check-changes
      - controller-agent
      - agent-base-artifact
      - agent-lang-images-artifact
      - controller
    steps:
      - name: Check results
        env:
          SHOULD_BUILD: ${{ needs.check-changes.outputs.should-build }}
          RESULT_CHECK: ${{ needs.check-changes.result }}
          RESULT_CONTROLLER_AGENT: ${{ needs.controller-agent.result }}
          RESULT_AGENT_BASE: ${{ needs.agent-base-artifact.result }}
          RESULT_AGENT_LANGS: ${{ needs.agent-lang-images-artifact.result }}
          RESULT_CONTROLLER: ${{ needs.controller.result }}
        run: |
          # check-changes must always succeed
          if [[ "$RESULT_CHECK" != "success" ]]; then
            echo "::error::check-changes result: $RESULT_CHECK"
            exit 1
          fi

          # When should-build is false, remaining jobs are expected to be skipped
          if [[ "$SHOULD_BUILD" == "false" ]]; then
            echo "Build skipped (no code changes)"
            exit 0
          fi

          # When should-build is true, downstream jobs must succeed (or be skipped for PR-only jobs on push)
          FAILED=false
          for result_var in RESULT_CONTROLLER_AGENT RESULT_AGENT_BASE RESULT_AGENT_LANGS RESULT_CONTROLLER; do
            result="${!result_var}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::${result_var} = ${result}"
              FAILED=true
            fi
          done

          if [[ "$FAILED" == "true" ]]; then
            exit 1
          fi

          echo "All image checks passed"
