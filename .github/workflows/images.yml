name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'harness/**'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'api/**'
      - 'go.mod'
      - 'go.sum'
      # agent-base-artifact now builds through .github/actions/goose-image, so an
      # edit to that action changes what this workflow produces. Without these
      # the arm64 leg -- which has no other consumer anywhere in CI -- would
      # not run at all on a PR that only touches the action.
      - '.github/actions/**'
      - '.github/workflows/images.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'harness/**'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'api/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/actions/**'
      - '.github/workflows/images.yml'
  workflow_dispatch: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  controller-agent:
    permissions:
      contents: read
    name: Build controller agent image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build image
        run: make controller-agent-build

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: make controller-agent-push

  # PR-time only: build agent-base + all four language images natively for
  # amd64 and arm64, and upload each as a downloadable workflow artifact
  # instead of pushing (no credentials needed). Uses Konveyor's shared
  # build-image action — the same one analyzer-lsp's demo-testing.yml uses,
  # transitively, via e2e-image-build.yaml.
  # The real multi-arch build+push lives in image-build-push.yml
  # (filter-free so tag pushes fire reliably).
  agent-base-artifact:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    name: Build agent-base artifact (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Same ~35 minute goose compile the e2e job pays for, on two runners
      # here. image-build-push.yml deliberately does not use this: the
      # published images build goose from source.
      - name: Restore the prebuilt goose image
        id: goose
        uses: ./.github/actions/goose-image

      - name: Build and upload agent-base artifact
        uses: konveyor/ci/build-image@e45ec039d03d41be52ae0c9abef260ee3ae8172a # main
        with:
          repo: ${{ github.repository }}
          checked_out: true
          image_name: agent-base
          image_tag: pr${{ github.event.pull_request.number }}-${{ matrix.arch }}
          dockerfile_path: images/agent-base/Containerfile
          build_context: "."
          build_args: GOOSE_IMAGE=${{ steps.goose.outputs.image }}
          cache-key-file: harness/go.sum

  agent-lang-images-artifact:
    needs: agent-base-artifact
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    name: Build ${{ matrix.image.name }} artifact (${{ matrix.arch_info.arch }})
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: agent-go
            containerfile: images/agent-go/Containerfile
          - name: agent-java
            containerfile: images/agent-java/Containerfile
          - name: agent-csharp
            containerfile: images/agent-csharp/Containerfile
          - name: agent-nodejs
            containerfile: images/agent-nodejs/Containerfile
        arch_info:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch_info.runner }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and upload ${{ matrix.image.name }} artifact
        uses: konveyor/ci/build-image@e45ec039d03d41be52ae0c9abef260ee3ae8172a # main
        with:
          repo: ${{ github.repository }}
          checked_out: true
          image_name: ${{ matrix.image.name }}
          image_tag: pr${{ github.event.pull_request.number }}-${{ matrix.arch_info.arch }}
          dockerfile_path: ${{ matrix.image.containerfile }}
          build_context: "."
          base_image: agent-base--pr${{ github.event.pull_request.number }}-${{ matrix.arch_info.arch }}
          base_image_arg: BASE_IMAGE

  # PR-time build check only. The versioned build+push of the controller
  # image lives in image-build-push.yml (filter-free so tag pushes fire).
  controller:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    name: Build controller image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build image
        run: make docker-build
